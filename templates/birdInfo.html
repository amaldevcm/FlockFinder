<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../static/styles/bird-info.css">
    <script src="../static/javascript/main.js"></script>
    <title>Sem 2 Project </title>
</head>

<body class="">
    <header>
        <h1>Bird Watcher</h1>
    </header>

    <section>
        <a href="/" class="back-arrow">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
            </svg>
        </a>
    </section>
    <section class="bird-details">
        <div>
            <h2>{{data.name}}</h2>
            <i>{{data.scientific_name}}</i><br>

            <div class="detail-container">
                <div>
                    <h3>Found In</h3>
                    <ul id="location-element" name="location-element"></ul>
                </div>

                <div>
                    <h3>Habitat</h3>
                    <span>{{data.habitat}}</span>
                </div>

                <div>
                    <h3>Wingspan</h3>
                    <span>{{data.wingspan}}</span>
                </div>

                <div>
                    <h3>Distinct features</h3>
                    <ul id="distinct-features" name="distinct-features"></ul>
                </div>
                
                <div>
                    <h3>Threats</h3>
                    <ul id="threats" name="threats"></ul>
                </div>

                <div>
                    <h3>Lifespan</h3>
                    <span>{{data.lifespan}}</span>
                </div>

                <div>
                    <h3>Estimated Population</h3>
                    <span>{{data.estimated_population_size}}</span>
                </div>
            </div>
        </div>
        <div>
            <img src="{{data.img}}" alt="bird img">
        </div>
    </section>

</body>

<script>
    const result = {{ data | safe}};             // processing received data
    console.log(result);
    
    let locationEle = document.getElementById('location-element');
    result.location.forEach(loc => {
        let ele = document.createElement('li');
        ele.innerText = loc;
        locationEle.append(ele)
    });

    let featureEle = document.getElementById('distinct-features');
    result.most_distinctive_feature.forEach(feature => {
        let ele = document.createElement('li');
        ele.innerText = feature;
        featureEle.append(ele);
    });

    let threatEle = document.getElementById('threats');
    result.biggest_threat.forEach(threat => {
        let ele = document.createElement('li');
        ele.innerText = threat;
        threatEle.append(ele);
    });
        
</script>
</html>
