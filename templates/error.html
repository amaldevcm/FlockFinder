<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    @import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css");
  </style>

  <link rel="stylesheet" href="../static/styles/bird-info.css">
  <script src="../static/javascript/main.js"></script>
  <title>Sem 2 Project </title>
</head>

<body class="">
  <header>
    <h1>Bird Watcher</h1>
  </header>

  <form class="min-h-[60vh] flex flex-col items-center justify-center px-4" method="get">
    <div class="text-center">
      <div class="bg-red-100 p-3 rounded-full inline-flex mb-6">
        <i class="bi bi-exclamation-circle text-5xl text-red-600"></i>
      </div>

      <h1 class="text-2xl font-bold text-white mb-2">
        Something Went Wrong
      </h1>
      <p class="text-gray-300 max-w-md mx-auto mb-8">We're having trouble loading this page. Please try again.</p>

      <button type="button" onclick="window.location.reload(true);"
        class="inline-flex items-center px-6 py-3 rounded-lg font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors me-3">
        <i class="bi bi-arrow-clockwise text-lg mr-2"></i>
        Try Again
      </button>

      <button type="submit"
        class="inline-flex items-center px-6 py-3 rounded-lg font-medium text-white bg-gray-600 hover:bg-gray-700 transition-colors">
        Back
      </button>
    </div>
  </form>
</body>

</html>
